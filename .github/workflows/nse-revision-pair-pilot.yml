name: NSE revised filing pair regression pilot

on:
  push:
    branches:
      - research/free-fundamental-sources
    paths:
      - ".github/workflows/nse-revision-pair-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/free-fundamental-sources
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated parser dependency
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/xbrl-deps" --no-save --no-package-lock fast-xml-parser@5.12.1
          mkdir -p node_modules
          ln -s "$RUNNER_TEMP/xbrl-deps/node_modules/fast-xml-parser" node_modules/fast-xml-parser
      - name: Resolve original and revised official NSE filing pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail --location --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 120 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" \
            --referer "https://www.nseindia.in/companies-listing/corporate-integrated-filing" \
            --header "Accept: application/json, text/plain, */*" \
            --get "https://www.nseindia.in/api/integrated-filing-results" \
            --data-urlencode "index=equities" --data-urlencode "symbol=SARVESHWAR" \
            --data-urlencode "type=Integrated Filing- Financials" \
            --data-urlencode "page=1" --data-urlencode "size=100" \
            --output artifacts/SARVESHWAR_integrated_filing_api.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("artifacts/SARVESHWAR_integrated_filing_api.json").read_text())
          rows=data.get("data", [])
          matches=[r for r in rows if r.get("symbol")=="SARVESHWAR" and r.get("qe_Date")=="30-SEP-2026" and r.get("consolidated")=="Standalone" and r.get("type")=="Integrated Filing- Financials" and r.get("type_Sub") in ("Original","Revision")]
          originals=[r for r in matches if r.get("type_Sub")=="Original"]
          revisions=[r for r in matches if r.get("type_Sub")=="Revision"]
          if len(originals)!=1 or len(revisions)!=1:
              raise SystemExit(f"Expected exactly one original and one revision for SARVESHWAR 30-SEP-2026 standalone; got original={len(originals)} revision={len(revisions)}")
          for kind,row in (("original",originals[0]),("revision",revisions[0])):
              if not row.get("xbrl"): raise SystemExit(f"{kind} row has no XBRL URL")
              fields=["symbol","smName","seq_Id","qe_Date","type","type_Sub","audited","consolidated","broadcast_Date","creation_Date","revised_Date","revision_Remark","ixbrl","ixbrlFileSize","xbrl","xbrlFileSize"]
              meta={k:row.get(k) for k in fields}
              Path(f"artifacts/SARVESHWAR_{kind}_metadata.json").write_text(json.dumps(meta,indent=2))
              Path(f"artifacts/SARVESHWAR_{kind}_xbrl_url.txt").write_text(row["xbrl"])
          if originals[0].get("seq_Id")==revisions[0].get("seq_Id"): raise SystemExit("Original and revision unexpectedly share seq_Id")
          if originals[0].get("qe_Date")!=revisions[0].get("qe_Date") or originals[0].get("consolidated")!=revisions[0].get("consolidated"):
              raise SystemExit("Original/revision period or basis mismatch")
          print(json.dumps({"original":json.loads(Path("artifacts/SARVESHWAR_original_metadata.json").read_text()),"revision":json.loads(Path("artifacts/SARVESHWAR_revision_metadata.json").read_text())},indent=2))
          PY
      - name: Download both original and revised XBRL instances
        shell: bash
        run: |
          set -euo pipefail
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          for kind in original revision; do
            xbrl_url="$(cat "artifacts/SARVESHWAR_${kind}_xbrl_url.txt")"
            cookie_jar="artifacts/sarveshwar-${kind}-cookies.txt"
            downloaded=""
            for site in www.nseindia.in www.nseindia.com; do
              curl --silent --show-error --location --max-time 60 --user-agent "$ua" --cookie-jar "$cookie_jar" --output /dev/null "https://$site/companies-listing/corporate-integrated-filing" || true
              out="artifacts/${site}-sarveshwar-${kind}.response"
              curl --silent --show-error --location --max-time 120 --user-agent "$ua" --cookie "$cookie_jar" \
                --referer "https://$site/companies-listing/corporate-integrated-filing" \
                --header "Accept: application/xml,text/xml,*/*" --get "https://$site/api/download_xbrl" \
                --data-urlencode "fileUrl=$xbrl_url" --output "$out" || true
              if grep -Eqi '<([[:alnum:]_]+:)?xbrl([ >])' "$out"; then cp "$out" "artifacts/SARVESHWAR_2026-09-30_${kind}_NSE_XBRL.xml"; downloaded=yes; break; fi
            done
            if [ -z "$downloaded" ]; then
              for host in nsearchives.nseindia.in nsearchives.nseindia.com; do
                out="artifacts/${host}-sarveshwar-${kind}.response"
                curl --silent --show-error --location --max-time 120 --user-agent "$ua" --cookie "$cookie_jar" \
                  --referer "https://www.nseindia.in/companies-listing/corporate-integrated-filing" \
                  --header "Accept: application/xml,text/xml,application/octet-stream,*/*" \
                  --output "$out" "https://$host/corporate/xbrl/${xbrl_url##*/}" || true
                if grep -Eqi '<([[:alnum:]_]+:)?xbrl([ >])' "$out"; then cp "$out" "artifacts/SARVESHWAR_2026-09-30_${kind}_NSE_XBRL.xml"; downloaded=yes; break; fi
              done
            fi
            if [ -z "$downloaded" ]; then echo "Failed to download SARVESHWAR $kind XBRL" >&2; exit 1; fi
            sha256sum "artifacts/SARVESHWAR_2026-09-30_${kind}_NSE_XBRL.xml" | tee -a artifacts/SARVESHWAR-XBRL-SHA256.txt
          done
      - name: Parse and compare original versus revision without overwriting either
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --input-type=module -e '
            import fs from "node:fs";
            import { extractXbrl } from "./research/fundamental_pilot/xbrl_extract.ts";
            const results={};
            for(const kind of ["original","revision"]){
              const path=`artifacts/SARVESHWAR_2026-09-30_${kind}_NSE_XBRL.xml`;
              const xml=fs.readFileSync(path,"utf8");
              const out=extractXbrl(xml);
              if(!out.contextCount||!out.factCount||!Object.keys(out.units).length) throw new Error(`Empty parse for ${kind}`);
              const meta=JSON.parse(fs.readFileSync(`artifacts/SARVESHWAR_${kind}_metadata.json`,"utf8"));
              results[kind]={meta,bytes:Buffer.byteLength(xml),contexts:out.contextCount,facts:out.factCount,units:out.units,warnings:out.warnings,parsedFacts:out.facts};
            }
            const a=results.original,b=results.revision;
            for(const k of ["symbol","qe_Date","consolidated"]) if(a.meta[k]!==b.meta[k]) throw new Error(`Filing pair mismatch on ${k}`);
            if(a.meta.type_Sub!=="Original"||b.meta.type_Sub!=="Revision") throw new Error("Submission labels not original/revision");
            const key=f=>[f.concept,f.contextRef,f.unitRef].join("|");
            const ma=new Map(a.parsedFacts.map(f=>[key(f),f]));
            const mb=new Map(b.parsedFacts.map(f=>[key(f),f]));
            const changed=[];
            for(const [k,fa] of ma){const fb=mb.get(k);if(fb && (fa.rawValue!==fb.rawValue||fa.isNil!==fb.isNil||fa.numericValue!==fb.numericValue)) changed.push({key:k,original:{rawValue:fa.rawValue,numericValue:fa.numericValue,isNil:fa.isNil},revision:{rawValue:fb.rawValue,numericValue:fb.numericValue,isNil:fb.isNil}});}
            const report={
              status:"ORIGINAL_REVISION_PAIR_PARSE_PASS",
              identity:{symbol:a.meta.symbol,company:a.meta.smName,period:a.meta.qe_Date,basis:a.meta.consolidated,audit:a.meta.audited},
              original:{seq_Id:a.meta.seq_Id,broadcast:a.meta.broadcast_Date,revisionDate:a.meta.revised_Date,revisionRemark:a.meta.revision_Remark,bytes:a.bytes,contexts:a.contexts,facts:a.facts,units:a.units,warnings:a.warnings},
              revision:{seq_Id:b.meta.seq_Id,broadcast:b.meta.broadcast_Date,revisionDate:b.meta.revised_Date,revisionRemark:b.meta.revision_Remark,bytes:b.bytes,contexts:b.contexts,facts:b.facts,units:b.units,warnings:b.warnings},
              distinctSequenceIds:a.meta.seq_Id!==b.meta.seq_Id,
              samePeriodAndBasis:a.meta.qe_Date===b.meta.qe_Date&&a.meta.consolidated===b.meta.consolidated,
              matchedFactKeys:ma.size,
              commonFactKeys:[...ma.keys()].filter(k=>mb.has(k)).length,
              changedCommonFacts:changed,
              note:"Both filings are preserved independently. The revision does not overwrite the original. This generic parse does not certify the accounting correctness of revised values."
            };
            delete a.parsedFacts;delete b.parsedFacts;
            fs.writeFileSync("artifacts/SARVESHWAR_revision_comparison.json",JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
          '
      - name: Upload original and revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-sarveshwar-original-revision-xbrl-pair
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
