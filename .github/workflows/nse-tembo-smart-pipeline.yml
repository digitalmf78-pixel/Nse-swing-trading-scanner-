name: NSE TEMBO standalone fundamental revision audit

on:
  push:
    branches:
      - research/free-fundamental-sources
    paths:
      - ".github/workflows/nse-tembo-smart-pipeline.yml"
      - "research/fundamental_pilot/nse_integrated_filing_client.ts"
      - "research/fundamental_pilot/xbrl_extract.ts"
      - "research/fundamental_pilot/xbrl_metric_fact_selector.ts"
      - "research/fundamental_pilot/metric_revision_guard.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tembo-issuer-revision-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/free-fundamental-sources

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated parser dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/tembo-xbrl-deps" --no-save --no-package-lock fast-xml-parser@5.12.1
          mkdir -p node_modules
          ln -s "$RUNNER_TEMP/tembo-xbrl-deps/node_modules/fast-xml-parser" node_modules/fast-xml-parser

      - name: Resolve complete official NSE filing and revision history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          import { fetchNseIntegratedFilingRows, selectNseIssuerPeriodHistory } from './research/fundamental_pilot/nse_integrated_filing_client.ts';
          const fetched=await fetchNseIntegratedFilingRows({symbol:'TEMBO',pageSize:100,maxPages:20,maxRetries:3,timeoutMs:45000});
          const current=selectNseIssuerPeriodHistory(fetched.rows,{symbol:'TEMBO',period:'30-SEP-2026',basis:'Standalone'});
          const prior=selectNseIssuerPeriodHistory(fetched.rows,{symbol:'TEMBO',period:'30-SEP-2025',basis:'Standalone'});
          const currentOk=current.status==='ORIGINAL_ONLY';
          const priorOk=['ORIGINAL_ONLY','REVISION_HISTORY'].includes(prior.status);
          const allowed=fetched.complete&&currentOk&&priorOk;
          const out={
            symbol:'TEMBO',issuer:'Tembo Global Industries Limited',sector:'NON_FINANCIAL',basis:'Standalone',
            currentPeriod:'30-SEP-2026',priorPeriod:'30-SEP-2025',
            source:fetched.source,pagesFetched:fetched.pagesFetched,rowCount:fetched.rows.length,
            paginationComplete:fetched.complete,exactDuplicateRows:fetched.exactDuplicateRows,warnings:fetched.warnings,
            current:{status:current.status,original:current.original,revisions:current.revisions},
            prior:{status:prior.status,original:prior.original,revisions:prior.revisions},
            auditAllowed:allowed,productionApproved:false
          };
          fs.writeFileSync('artifacts/tembo-filing-history.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({
            symbol:out.symbol,pagesFetched:out.pagesFetched,rowCount:out.rowCount,paginationComplete:out.paginationComplete,
            current:{status:current.status,sequenceId:current.original?.seq_Id,revisionCount:current.revisions?.length??0},
            prior:{status:prior.status,sequenceId:prior.original?.seq_Id,revisionCount:prior.revisions?.length??0,
              revisions:prior.revisions?.map(r=>({sequenceId:r.seq_Id,revisedDate:r.revised_Date,remark:r.revision_Remark}))},
            auditAllowed:allowed,productionApproved:false
          },null,2));
          JS

      - name: Download current Original and prior Original plus every Revision
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(jq -r '.auditAllowed' artifacts/tembo-filing-history.json)" != "true" ]; then
            echo "Blocked: complete NSE pagination and exact filing history are required." | tee artifacts/download-status.txt
            exit 0
          fi
          mkdir -p artifacts/xbrl
          node --input-type=module <<'JS' > artifacts/download-list.tsv
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('artifacts/tembo-filing-history.json','utf8'));
          const rows=[{kind:'current_original',row:d.current.original},{kind:'prior_original',row:d.prior.original},
            ...d.prior.revisions.map((row,i)=>({kind:'prior_revision_'+(i+1),row}))];
          for(const x of rows) console.log([x.kind,x.row.seq_Id,x.row.xbrl].join('\t'));
          JS
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          cookie_jar="artifacts/xbrl/nse-cookies.txt"
          curl --silent --show-error --location --max-time 60 --user-agent "$ua" --cookie-jar "$cookie_jar" --output /dev/null "https://www.nseindia.in/companies-listing/corporate-integrated-filing" || true
          while IFS=$'\t' read -r kind seq url; do
            response="artifacts/xbrl/$kind-$seq.response"
            out="artifacts/xbrl/$kind-$seq.xml"
            curl --silent --show-error --location --max-time 120 --user-agent "$ua" --cookie "$cookie_jar" \
              --referer "https://www.nseindia.in/companies-listing/corporate-integrated-filing" \
              --header "Accept: application/xml,text/xml,application/octet-stream,*/*" \
              --get "https://www.nseindia.in/api/download_xbrl" --data-urlencode "fileUrl=$url" --output "$response" || true
            if grep -Eqi '<([[:alnum:]_]+:)?xbrl([ >])' "$response"; then
              mv "$response" "$out"
            else
              direct="https://nsearchives.nseindia.in/corporate/xbrl/$(basename "$url")"
              curl --silent --show-error --location --max-time 120 --user-agent "$ua" --cookie "$cookie_jar" \
                --referer "https://www.nseindia.in/companies-listing/corporate-integrated-filing" \
                --header "Accept: application/xml,text/xml,application/octet-stream,*/*" --output "$out" "$direct" || true
            fi
            if ! grep -Eqi '<([[:alnum:]_]+:)?xbrl([ >])' "$out" 2>/dev/null; then
              echo "Official NSE XBRL download failed: $kind sequence $seq" >&2
              exit 1
            fi
            sha256sum "$out" | tee "artifacts/xbrl/$kind-$seq.sha256"
          done < artifacts/download-list.tsv

      - name: Parse exact YTD facts and evaluate each metric across revisions
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { extractXbrl } from './research/fundamental_pilot/xbrl_extract.ts';
          import { selectXbrlMetricFact } from './research/fundamental_pilot/xbrl_metric_fact_selector.ts';
          import { evaluateRevisionMetric } from './research/fundamental_pilot/metric_revision_guard.ts';
          const meta=JSON.parse(fs.readFileSync('artifacts/tembo-filing-history.json','utf8'));
          if(!meta.auditAllowed){
            const blocked={status:'FILING_HISTORY_BLOCKED',meta,productionApproved:false};
            fs.writeFileSync('artifacts/tembo-revision-audit.json',JSON.stringify(blocked,null,2));
            console.log(JSON.stringify(blocked,null,2));
            process.exit(0);
          }
          const versions=[{key:'current_original',row:meta.current.original,role:'current'},
            {key:'prior_original',row:meta.prior.original,role:'original'},
            ...meta.prior.revisions.map((row,i)=>({key:'prior_revision_'+(i+1),row,role:'revision'}))];
          const parsed={};
          const fileReports={};
          for(const v of versions){
            const path='artifacts/xbrl/'+v.key+'-'+v.row.seq_Id+'.xml';
            const xml=fs.readFileSync(path,'utf8');
            const out=extractXbrl(xml);
            if(!out.contextCount||!out.factCount||!Object.keys(out.units).length) throw new Error('Empty XBRL parse: '+v.key);
            if(out.warnings.length) throw new Error('Parser warnings block validation '+v.key+': '+JSON.stringify(out.warnings));
            parsed[v.key]=out;
            fileReports[v.key]={role:v.role,sequenceId:String(v.row.seq_Id),type:v.row.type_Sub,
              broadcastDate:v.row.broadcast_Date??null,revisedDate:v.row.revised_Date??null,
              revisionRemark:v.row.revision_Remark??null,bytes:Buffer.byteLength(xml),
              sha256:crypto.createHash('sha256').update(xml).digest('hex'),
              contexts:out.contextCount,facts:out.factCount,warnings:out.warnings};
          }
          const metrics=[
            {key:'REVENUE_GROWTH',concept:'in-capmkt:RevenueFromOperations'},
            {key:'PROFIT_GROWTH',concept:'in-capmkt:ProfitLossForPeriod'},
            {key:'OPERATING_CASH_FLOW',concept:'in-capmkt:CashFlowsFromUsedInOperatingActivities'}
          ];
          const periodStart='2025-04-01',periodEnd='2025-09-30';
          const request=concept=>({concept,periodStart,periodEnd,periodType:'YTD',basis:'STANDALONE',filingBasis:'STANDALONE'});
          const revisionMetricAudit={};
          for(const metric of metrics){
            const original=selectXbrlMetricFact(parsed.prior_original,request(metric.concept));
            const revisionSelections=meta.prior.revisions.map((row,i)=>({
              row,selection:selectXbrlMetricFact(parsed['prior_revision_'+(i+1)],request(metric.concept))
            }));
            const snapshots=[
              {sequenceId:String(meta.prior.original.seq_Id),kind:'Original',revisionAt:null,value:original.fact?.numericValue??null}
            ];
            for(const item of revisionSelections){
              const raw=item.row.revised_Date??item.row.creation_Date??null;
              const match=raw&&/^(\d{2})-([A-Z]{3})-(\d{4}) (\d{2}):(\d{2}):(\d{2})$/i.exec(raw);
              const months={JAN:'01',FEB:'02',MAR:'03',APR:'04',MAY:'05',JUN:'06',JUL:'07',AUG:'08',SEP:'09',OCT:'10',NOV:'11',DEC:'12'};
              const revisionAt=match?match[3]+'-'+months[match[2].toUpperCase()]+'-'+match[1]+'T'+match[4]+':'+match[5]+':'+match[6]+'Z':null;
              snapshots.push({sequenceId:String(item.row.seq_Id),kind:'Revision',revisionAt,value:item.selection.fact?.numericValue??null});
            }
            const units=[original.fact?.unitMeasures??null,...revisionSelections.map(x=>x.selection.fact?.unitMeasures??null)];
            const unitConsistent=units.every(u=>JSON.stringify(u)===JSON.stringify(units[0]));
            const decision=evaluateRevisionMetric('30-SEP-2025','Standalone',metric.concept,snapshots[0],snapshots.slice(1));
            const finalStatus=!unitConsistent?'REVISION_UNIT_CONFLICT_REVIEW_REQUIRED':decision.status;
            revisionMetricAudit[metric.key]={
              concept:metric.concept,periodStart,periodEnd,
              originalSelection:{status:original.status,explanation:original.explanation,fact:original.fact},
              revisionSelections:revisionSelections.map(x=>({sequenceId:String(x.row.seq_Id),revisedDate:x.row.revised_Date??null,
                revisionRemark:x.row.revision_Remark??null,status:x.selection.status,explanation:x.selection.explanation,fact:x.selection.fact})),
              unitConsistent,unitMeasures:units[0]??null,
              decision:{...decision,status:finalStatus,selectedValue:finalStatus==='REVISIONS_IDENTICAL_CANDIDATE'?decision.selectedValue:null}
            };
          }
          const currentPeriodFacts={};
          for(const metric of metrics){
            const concept=metric.concept;
            const selected=selectXbrlMetricFact(parsed.current_original,{concept,periodStart:'2026-04-01',periodEnd:'2026-09-30',periodType:'YTD',basis:'STANDALONE',filingBasis:'STANDALONE'});
            currentPeriodFacts[metric.key]={concept,status:selected.status,explanation:selected.explanation,fact:selected.fact};
          }
          const output={
            status:'TEMBO_OFFICIAL_NSE_REVISION_AUDIT_COMPLETED',
            issuer:meta.issuer,symbol:meta.symbol,basis:meta.basis,
            currentPeriod:meta.currentPeriod,priorPeriod:meta.priorPeriod,
            metadata:{pagesFetched:meta.pagesFetched,rowCount:meta.rowCount,paginationComplete:meta.paginationComplete,
              exactDuplicateRows:meta.exactDuplicateRows,currentHistory:meta.current.status,priorHistory:meta.prior.status},
            files:fileReports,currentPeriodFacts,priorYearRevisionMetricAudit:revisionMetricAudit,
            productionApproved:false,
            note:'Metric-level revision comparison only. Identical prior Original/Revision facts remain candidate-only; changed/missing facts are withheld pending exact official PDF cross-check. No growth rates are released in this audit.'
          };
          fs.writeFileSync('artifacts/tembo-revision-audit.json',JSON.stringify(output,null,2));
          console.log(JSON.stringify(output,null,2));
          JS

      - name: Upload NSE filing history, raw XBRL and revision audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-tembo-standalone-revision-audit
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
