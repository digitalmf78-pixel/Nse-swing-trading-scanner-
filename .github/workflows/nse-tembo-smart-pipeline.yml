name: NSE TEMBO standalone smart fundamental pilot

on:
  push:
    branches:
      - research/free-fundamental-sources
    paths:
      - ".github/workflows/nse-tembo-smart-pipeline.yml"
      - "research/fundamental_pilot/nse_integrated_filing_client.ts"
      - "research/fundamental_pilot/xbrl_extract.ts"
      - "research/fundamental_pilot/seven_metric_xbrl_pipeline.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tembo-issuer-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/free-fundamental-sources

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated parser dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/tembo-xbrl-deps" --no-save --no-package-lock fast-xml-parser@5.12.1
          mkdir -p node_modules
          ln -s "$RUNNER_TEMP/tembo-xbrl-deps/node_modules/fast-xml-parser" node_modules/fast-xml-parser

      - name: Resolve complete official NSE standalone filing history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          import { fetchNseIntegratedFilingRows, selectNseIssuerPeriodHistory } from './research/fundamental_pilot/nse_integrated_filing_client.ts';
          const fetched=await fetchNseIntegratedFilingRows({symbol:'TEMBO',pageSize:100,maxPages:20,maxRetries:3,timeoutMs:45000});
          const current=selectNseIssuerPeriodHistory(fetched.rows,{symbol:'TEMBO',period:'30-SEP-2026',basis:'Standalone'});
          const prior=selectNseIssuerPeriodHistory(fetched.rows,{symbol:'TEMBO',period:'30-SEP-2025',basis:'Standalone'});
          const historyUsable=['ORIGINAL_ONLY'].includes(current.status)&&['ORIGINAL_ONLY'].includes(prior.status);
          const allowed=fetched.complete&&historyUsable;
          const out={
            symbol:'TEMBO',issuer:'Tembo Global Industries Limited',sector:'NON_FINANCIAL',basis:'Standalone',
            currentPeriod:'30-SEP-2026',priorPeriod:'30-SEP-2025',
            source:fetched.source,pagesFetched:fetched.pagesFetched,rowCount:fetched.rows.length,
            paginationComplete:fetched.complete,exactDuplicateRows:fetched.exactDuplicateRows,warnings:fetched.warnings,
            current:{status:current.status,original:current.original,revisions:current.revisions},
            prior:{status:prior.status,original:prior.original,revisions:prior.revisions},
            pipelineAllowed:allowed,productionApproved:false
          };
          fs.writeFileSync('artifacts/tembo-filing-history.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({...out,current:{status:current.status,sequenceId:current.original?.seq_Id,revisions:current.revisions?.length},prior:{status:prior.status,sequenceId:prior.original?.seq_Id,revisions:prior.revisions?.length}},null,2));
          JS

      - name: Download exact-period original XBRL files
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(jq -r '.pipelineAllowed' artifacts/tembo-filing-history.json)" != "true" ]; then
            echo "Blocked: complete pagination and Original-only histories for both periods are required." | tee artifacts/download-status.txt
            exit 0
          fi
          mkdir -p artifacts/xbrl
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          cookie_jar="artifacts/xbrl/nse-cookies.txt"
          curl --silent --show-error --location --max-time 60 --user-agent "$ua" --cookie-jar "$cookie_jar" --output /dev/null "https://www.nseindia.in/companies-listing/corporate-integrated-filing" || true
          for key in current prior; do
            url="$(jq -r ".$key.original.xbrl" artifacts/tembo-filing-history.json)"
            seq="$(jq -r ".$key.original.seq_Id" artifacts/tembo-filing-history.json)"
            response="artifacts/xbrl/$key-$seq.response"
            out="artifacts/xbrl/$key-$seq.xml"
            curl --silent --show-error --location --max-time 120 --user-agent "$ua" --cookie "$cookie_jar" \
              --referer "https://www.nseindia.in/companies-listing/corporate-integrated-filing" \
              --header "Accept: application/xml,text/xml,application/octet-stream,*/*" \
              --get "https://www.nseindia.in/api/download_xbrl" --data-urlencode "fileUrl=$url" --output "$response" || true
            if grep -Eqi '<([[:alnum:]_]+:)?xbrl([ >])' "$response"; then
              mv "$response" "$out"
            else
              direct="https://nsearchives.nseindia.in/corporate/xbrl/$(basename "$url")"
              curl --silent --show-error --location --max-time 120 --user-agent "$ua" --cookie "$cookie_jar" \
                --referer "https://www.nseindia.in/companies-listing/corporate-integrated-filing" \
                --header "Accept: application/xml,text/xml,application/octet-stream,*/*" --output "$out" "$direct" || true
            fi
            if ! grep -Eqi '<([[:alnum:]_]+:)?xbrl([ >])' "$out" 2>/dev/null; then
              echo "Official NSE XBRL download failed for $key sequence $seq" >&2
              exit 1
            fi
            sha256sum "$out" | tee "artifacts/xbrl/$key-$seq.sha256"
          done

      - name: Parse exact periods and calculate candidate-only metrics
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { extractXbrl } from './research/fundamental_pilot/xbrl_extract.ts';
          import { buildSevenMetricXbrlPipeline } from './research/fundamental_pilot/seven_metric_xbrl_pipeline.ts';
          const meta=JSON.parse(fs.readFileSync('artifacts/tembo-filing-history.json','utf8'));
          if(!meta.pipelineAllowed){
            const blocked={status:'FILING_HISTORY_BLOCKED',meta,productionApproved:false,note:'No metrics calculated; original-only filing pair or complete pagination not confirmed.'};
            fs.writeFileSync('artifacts/tembo-fundamental-report.json',JSON.stringify(blocked,null,2));
            console.log(JSON.stringify(blocked,null,2));
            process.exit(0);
          }
          const parsed={};
          const fileMeta={};
          for(const key of ['current','prior']){
            const row=meta[key].original;
            const path='artifacts/xbrl/'+key+'-'+row.seq_Id+'.xml';
            const xml=fs.readFileSync(path,'utf8');
            const out=extractXbrl(xml);
            if(!out.contextCount||!out.factCount||!Object.keys(out.units).length) throw new Error('Empty XBRL parse for '+key);
            if(out.warnings.length) throw new Error('Parser warnings block issuer validation for '+key+': '+JSON.stringify(out.warnings));
            parsed[key]=out;
            fileMeta[key]={sequenceId:String(row.seq_Id),bytes:Buffer.byteLength(xml),sha256:crypto.createHash('sha256').update(xml).digest('hex'),contexts:out.contextCount,facts:out.factCount,units:out.units,warnings:out.warnings};
          }
          const pipeline=buildSevenMetricXbrlPipeline('NON_FINANCIAL',
            {extraction:parsed.current,periodType:'YTD',periodStart:'2026-04-01',periodEnd:'2026-09-30',basis:'STANDALONE',filingBasis:'STANDALONE'},
            {extraction:parsed.prior,periodType:'YTD',periodStart:'2025-04-01',periodEnd:'2025-09-30',basis:'STANDALONE',filingBasis:'STANDALONE'},
            {revenue:'in-capmkt:RevenueFromOperations',profit:'in-capmkt:ProfitLossForPeriod',profitAttribution:'STANDALONE_ENTITY',operatingCashFlow:'in-capmkt:CashFlowsFromUsedInOperatingActivities'});
          const report={
            status:'TEMBO_REAL_NSE_XBRL_CANDIDATE_PILOT',
            issuer:meta.issuer,symbol:meta.symbol,sector:meta.sector,basis:meta.basis,
            currentPeriod:meta.currentPeriod,priorPeriod:meta.priorPeriod,
            filingHistory:{current:{status:meta.current.status,sequenceId:meta.current.original.seq_Id},prior:{status:meta.prior.status,sequenceId:meta.prior.original.seq_Id},paginationComplete:meta.paginationComplete},
            files:fileMeta,
            currentSelections:Object.fromEntries(Object.entries(pipeline.currentSelections).map(([k,v])=>[k,{status:v.status,eligibleCount:v.eligibleCount,rejectedContextCount:v.rejectedContextCount,explanation:v.explanation}])),
            priorSelections:Object.fromEntries(Object.entries(pipeline.priorSelections).map(([k,v])=>[k,{status:v.status,eligibleCount:v.eligibleCount,rejectedContextCount:v.rejectedContextCount,explanation:v.explanation}])),
            candidates:pipeline.candidateReport.candidates,
            auditMatrix:pipeline.candidateReport.auditMatrix,
            productionApproved:false,
            note:'All results are raw-source-backed mechanical candidates only. Official results PDF tie-out, issuer notes/comparability review and revision checks remain mandatory before accepting any metric.'
          };
          fs.writeFileSync('artifacts/tembo-fundamental-report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          JS

      - name: Upload official NSE metadata, XBRL and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-tembo-standalone-fundamental-pilot
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
