name: KSHINTL quarterly OCF exact YTD derivation audit

on:
  push:
    branches:
      - research/free-fundamental-sources
    paths:
      - ".github/workflows/nse-kshintl-quarterly-ocf-derivation.yml"
      - "research/fundamental_pilot/xbrl_extract.ts"
      - "research/fundamental_pilot/nse_filing_pair.ts"
      - "research/fundamental_pilot/quarterly_ocf_from_ytd.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarterly-ocf-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/free-fundamental-sources
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated parser dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/xbrl-deps" --no-save --no-package-lock fast-xml-parser@5.12.1
          mkdir -p node_modules
          ln -s "$RUNNER_TEMP/xbrl-deps/node_modules/fast-xml-parser" node_modules/fast-xml-parser
      - name: Resolve four official original standalone filings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail --location --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 120 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" \
            --referer "https://www.nseindia.in/companies-listing/corporate-integrated-filing" \
            --header "Accept: application/json, text/plain, */*" \
            --get "https://www.nseindia.in/api/integrated-filing-results" \
            --data-urlencode "index=equities" --data-urlencode "symbol=KSHINTL" \
            --data-urlencode "type=Integrated Filing- Financials" --data-urlencode "page=1" \
            --data-urlencode "size=100" --output artifacts/KSHINTL_integrated_filing_api.json
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          import { findUniqueOriginalNseFiling, resolveOriginalNseFilingPair } from './research/fundamental_pilot/nse_filing_pair.ts';
          const rows=JSON.parse(fs.readFileSync('artifacts/KSHINTL_integrated_filing_api.json','utf8')).data ?? [];
          const q2=resolveOriginalNseFilingPair(rows,{symbol:'KSHINTL',basis:'Standalone',currentPeriod:'30-SEP-2026',priorPeriod:'30-SEP-2025'});
          const all={
            currentQ2:q2.current,
            priorQ2:q2.prior,
            currentQ1:findUniqueOriginalNseFiling(rows,{symbol:'KSHINTL',basis:'Standalone',period:'30-JUN-2026'}),
            priorQ1:findUniqueOriginalNseFiling(rows,{symbol:'KSHINTL',basis:'Standalone',period:'30-JUN-2025'}),
          };
          const metadata={};
          for(const [kind,row] of Object.entries(all)){
            if(!row){metadata[kind]=null;continue;}
            metadata[kind]=Object.fromEntries(['symbol','smName','seq_Id','qe_Date','type','type_Sub','audited','consolidated','broadcast_Date','revised_Date','revision_Remark','ixbrl','xbrl'].map(field=>[field,row[field]??null]));
            fs.writeFileSync(`artifacts/KSHINTL_${kind}_xbrl_url.txt`,row.xbrl);
          }
          fs.writeFileSync('artifacts/KSHINTL_quarterly_ocf_filings.json',JSON.stringify(metadata,null,2));
          console.log(JSON.stringify(metadata,null,2));
          JS
      - name: Download four original NSE XML instances
        shell: bash
        run: |
          set -euo pipefail
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          for kind in currentQ2 priorQ2 currentQ1 priorQ1; do
            if [ ! -s "artifacts/KSHINTL_${kind}_xbrl_url.txt" ]; then echo "No original filing for $kind; preserve as missing"; continue; fi
            xbrl_url="$(cat "artifacts/KSHINTL_${kind}_xbrl_url.txt")"
            cookie_jar="artifacts/kshintl-${kind}-cookies.txt"
            downloaded=""
            for site in www.nseindia.in www.nseindia.com; do
              curl --silent --show-error --location --max-time 60 --user-agent "$ua" --cookie-jar "$cookie_jar" --output /dev/null "https://$site/companies-listing/corporate-integrated-filing" || true
              out="artifacts/${site}-${kind}.response"
              curl --silent --show-error --location --max-time 120 --user-agent "$ua" --cookie "$cookie_jar" \
                --referer "https://$site/companies-listing/corporate-integrated-filing" \
                --header "Accept: application/xml,text/xml,*/*" --get "https://$site/api/download_xbrl" \
                --data-urlencode "fileUrl=$xbrl_url" --output "$out" || true
              if grep -Eqi '<([[:alnum:]_]+:)?xbrl([ >])' "$out"; then cp "$out" "artifacts/KSHINTL_${kind}.xml"; downloaded=yes; break; fi
            done
            if [ -z "$downloaded" ]; then
              for host in nsearchives.nseindia.in nsearchives.nseindia.com; do
                out="artifacts/${host}-${kind}.response"
                curl --silent --show-error --location --max-time 120 --user-agent "$ua" --cookie "$cookie_jar" \
                  --referer "https://www.nseindia.in/companies-listing/corporate-integrated-filing" \
                  --header "Accept: application/xml,text/xml,application/octet-stream,*/*" \
                  --output "$out" "https://$host/corporate/xbrl/${xbrl_url##*/}" || true
                if grep -Eqi '<([[:alnum:]_]+:)?xbrl([ >])' "$out"; then cp "$out" "artifacts/KSHINTL_${kind}.xml"; downloaded=yes; break; fi
              done
            fi
            if [ -z "$downloaded" ]; then echo "Unable to download official NSE XML for $kind" >&2; exit 1; fi
            sha256sum "artifacts/KSHINTL_${kind}.xml" | tee "artifacts/KSHINTL_${kind}_SHA256.txt"
          done
      - name: Extract four exact YTD OCF facts and gate quarterly derivation
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          import { extractXbrl } from './research/fundamental_pilot/xbrl_extract.ts';
          import { deriveQuarterlyOcfFromYtd } from './research/fundamental_pilot/quarterly_ocf_from_ytd.ts';
          const metadata=JSON.parse(fs.readFileSync('artifacts/KSHINTL_quarterly_ocf_filings.json','utf8'));
          const expectations={
            currentQ2:{start:'2026-04-01',end:'2026-09-30'},
            currentQ1:{start:'2026-04-01',end:'2026-06-30'},
            priorQ2:{start:'2025-04-01',end:'2025-09-30'},
            priorQ1:{start:'2025-04-01',end:'2025-06-30'},
          };
          const extracted={};
          for(const [kind,period] of Object.entries(expectations)){
            if(!metadata[kind]){
              extracted[kind]={filingStatus:'MISSING_ORIGINAL_FILING',metadata:null,contexts:0,facts:0,candidateCount:0,candidate:null,parserWarnings:[]};
              continue;
            }
            const out=extractXbrl(fs.readFileSync(`artifacts/KSHINTL_${kind}.xml`,'utf8'));
            if(out.warnings.length) throw new Error(`Parser warnings for ${kind}: ${out.warnings.join('; ')}`);
            const applicabilityFact=out.facts.find(f=>f.concept.endsWith(':WhetherCashFlowStatementIsApplicableOnCompany'));
            const applicabilityRaw=applicabilityFact?.rawValue?.trim().toLowerCase()??null;
            const cashFlowStatementApplicable=applicabilityRaw==='true'?true:applicabilityRaw==='false'?false:null;
            const candidates=out.facts.flatMap(f=>{
              if(f.concept!=='in-capmkt:CashFlowsFromUsedInOperatingActivities'||!f.contextRef) return [];
              const ctx=out.contexts[f.contextRef];
              if(!ctx||ctx.periodStart!==period.start||ctx.periodEnd!==period.end||ctx.instant||ctx.dimensions.length) return [];
              return [{concept:f.concept,numericValue:f.numericValue,rawValue:f.rawValue,isNil:f.isNil,unitMeasures:f.unitRef?out.units[f.unitRef]??[]:[],dimensions:[...ctx.dimensions],periodStart:ctx.periodStart,periodEnd:ctx.periodEnd,periodType:'YTD',basis:'STANDALONE'}];
            });
            if(candidates.length>1) throw new Error(`Ambiguous group OCF facts for ${kind}: ${candidates.length}`);
            extracted[kind]={filingStatus:'FOUND',metadata:metadata[kind],contexts:out.contextCount,facts:out.factCount,cashFlowStatementApplicable,applicabilityRaw,candidateCount:candidates.length,candidate:candidates[0]??null,parserWarnings:out.warnings};
          }
          const missingFilings=Object.entries(extracted).filter(([,v])=>v.filingStatus==='MISSING_ORIGINAL_FILING').map(([k])=>k);
          const nonApplicable=Object.entries(extracted).filter(([,v])=>v.cashFlowStatementApplicable===false).map(([k])=>k);
          const missingFacts=Object.entries(extracted).filter(([,v])=>v.filingStatus==='FOUND'&&v.cashFlowStatementApplicable!==false&&v.candidateCount===0).map(([k])=>k);
          const allFacts=Object.values(extracted).every(v=>v.candidateCount===1);
          const derivation=allFacts?deriveQuarterlyOcfFromYtd(extracted.currentQ2.candidate,extracted.currentQ1.candidate,extracted.priorQ2.candidate,extracted.priorQ1.candidate):null;
          const blockers=[...missingFilings.map(k=>({filing:k,reason:'MISSING_ORIGINAL_FILING'})),...nonApplicable.map(k=>({filing:k,reason:'CASH_FLOW_STATEMENT_NOT_APPLICABLE'})),...missingFacts.map(k=>({filing:k,reason:'OCF_FACT_MISSING_WHEN_STATEMENT_APPLICABLE'}))];
          if(extracted.currentQ1.cashFlowStatementApplicable!==false) throw new Error('Regression expectation changed: current Q1 cash-flow statement applicability must be explicitly false for this pilot');
          if(extracted.priorQ1.filingStatus!=='MISSING_ORIGINAL_FILING') throw new Error('Regression expectation changed: prior Q1 original filing is expected to remain unavailable in the official NSE index sample');
          const status=blockers.length?'BLOCKED_QUARTERLY_DERIVATION':derivation?.status??'BLOCKED_UNKNOWN';
          const report={status,identity:{symbol:'KSHINTL',basis:'Standalone'},filings:extracted,missingFilings,nonApplicable,missingFacts,blockers,quarterlyOcfDerivation:derivation,note:'Quarterly OCF is derived only if all four exact original standalone YTD facts exist and pass the TypeScript alignment gate. Explicit false cash-flow-statement applicability is N/A, not missing and not zero. A missing original filing remains MISSING. No quarterly OCF is inferred when required facts are absent.'};
          fs.writeFileSync('artifacts/KSHINTL_quarterly_ocf_derivation.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({status,missingFilings,missingFacts,ocfFacts:Object.fromEntries(Object.entries(extracted).map(([k,v])=>[k,{sequenceId:v.metadata?.seq_Id??null,filingStatus:v.filingStatus,cashFlowStatementApplicable:v.cashFlowStatementApplicable??null,applicabilityRaw:v.applicabilityRaw??null,candidateCount:v.candidateCount,rawValue:v.candidate?.rawValue??null,numericValue:v.candidate?.numericValue??null,unitMeasures:v.candidate?.unitMeasures??[]} ])),quarterlyOcfDerivation:derivation},null,2));
          JS
      - name: Upload four filings and OCF derivation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kshintl-quarterly-ocf-ytd-derivation
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

# Quarterly OCF is never guessed when the Q1 YTD cash-flow statement is absent.

# Missing historical originals are reported as MISSING, never coerced to zero.
