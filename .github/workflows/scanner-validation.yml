name: Scanner Validation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/delivery-30d-criteria-labels
      - research/free-fundamental-sources
    paths:
      - "src/**"
      - "server/**"
      - "research/**"
      - "scripts/**"
      - "data/**"
      - "outputs/**"
      - "*.ts"
      - "*.tsx"
      - "*.json"
      - "package.json"
      - "tsconfig.json"
      - "index.html"
      - ".github/workflows/scanner-validation.yml"

permissions:
  contents: read

concurrency:
  group: scanner-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, production build and artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout isolated scanner branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: NSE fundamental runtime source-policy audit
        id: dataaudit
        run: npm run audit:data

      - name: Fundamental pilot unit tests
        id: tests
        run: npm run test:fundamental-pilot

      - name: TypeScript validation
        id: typecheck
        run: npm run lint

      - name: Production build
        id: build
        run: npm run build

      - name: Create validation report
        if: always()
        shell: bash
        run: |
          mkdir -p validation-artifact
          {
            echo "# Scanner validation report"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Node: $(node --version 2>/dev/null || echo unavailable)"
            echo "- npm: $(npm --version 2>/dev/null || echo unavailable)"
            echo "- Read-only data audit: ${{ steps.dataaudit.outcome }}"
            echo "- Fundamental tests: ${{ steps.tests.outcome }}"\n            echo "- TypeScript check: ${{ steps.typecheck.outcome }}"
            echo "- Production build: ${{ steps.build.outcome }}"
            echo
            echo "This report validates source-policy invariants, isolated tests, TypeScript compilation and the Vite production build."
            echo "It does not certify live NSE data availability or execute a full Bhavcopy-to-fundamental fetch against the user runtime."
          } > validation-artifact/validation-report.md

      - name: Upload production build and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-validation-${{ github.sha }}
          path: |
            dist/
            validation-artifact/*.md
          if-no-files-found: warn
          retention-days: 14
