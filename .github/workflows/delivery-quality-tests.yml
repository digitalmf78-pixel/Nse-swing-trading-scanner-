name: Delivery data quality tests

on:
  pull_request:
    paths:
      - '.github/workflows/delivery-quality-tests.yml'
      - 'scripts/delivery-quality.mjs'
      - 'scripts/delivery-quality.test.mjs'
      - 'scripts/update-delivery-dashboard.mjs'
      - 'docs/index.html'
  push:
    branches: [main]
    paths:
      - '.github/workflows/delivery-quality-tests.yml'
      - 'scripts/delivery-quality.mjs'
      - 'scripts/delivery-quality.test.mjs'
      - 'scripts/update-delivery-dashboard.mjs'
      - 'docs/index.html'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard updater syntax
        run: node --check scripts/update-delivery-dashboard.mjs
      - name: Run delivery quality tests
        run: node --test scripts/delivery-quality.test.mjs
