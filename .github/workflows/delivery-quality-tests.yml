name: Delivery data quality tests

on:
  pull_request:
    paths:
      - '.github/workflows/delivery-quality-tests.yml'
      - 'scripts/delivery-quality.mjs'
      - 'scripts/delivery-quality.test.mjs'
      - 'scripts/check-nse-master.mjs'
      - 'scripts/update-delivery-dashboard.mjs'
      - 'docs/index.html'
  push:
    branches: [main]
    paths:
      - '.github/workflows/delivery-quality-tests.yml'
      - 'scripts/check-nse-master.mjs'
      - 'scripts/delivery-quality.mjs'
      - 'scripts/delivery-quality.test.mjs'
      - 'scripts/update-delivery-dashboard.mjs'
      - 'docs/index.html'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard updater syntax
        run: node --check scripts/update-delivery-dashboard.mjs
      - name: Check dashboard inline JavaScript syntax
        run: node --input-type=module -e 'import fs from "node:fs"; const html = fs.readFileSync("docs/index.html", "utf8"); const script = html.match(/<script>([\s\S]*?)<\/script>/i)?.[1]; if (!script) throw new Error("Dashboard inline script not found"); new Function(script); console.log("Dashboard JavaScript syntax OK");'
      - name: Check live NSE Equity master compatibility (advisory)
        continue-on-error: true
        run: node scripts/check-nse-master.mjs
      - name: Run delivery quality tests
        run: node --test scripts/delivery-quality.test.mjs
