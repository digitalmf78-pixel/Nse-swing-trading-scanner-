name: Fundamental pilot tests

on:
  push:
    branches:
      - research/free-fundamental-sources
    paths:
      - "research/fundamental_pilot/**"
      - ".github/workflows/fundamental-pilot-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xbrl-parser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install only the isolated parser dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/fundamental-pilot-deps" --no-save --no-package-lock fast-xml-parser@5.12.1
          mkdir -p node_modules
          ln -s "$RUNNER_TEMP/fundamental-pilot-deps/node_modules/fast-xml-parser" node_modules/fast-xml-parser
      - name: Run isolated TypeScript parser tests
        run: node --experimental-strip-types --test research/fundamental_pilot/xbrl_extract.test.ts
