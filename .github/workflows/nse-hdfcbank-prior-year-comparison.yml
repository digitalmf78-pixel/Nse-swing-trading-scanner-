name: NSE HDFC Bank prior-year original XBRL comparison
# Research-only pair comparison. No banking metric formula or scanner runtime mapping. Every fact retains its original period, dimensions and unit.

on:
  push:
    branches:
      - research/free-fundamental-sources
    paths:
      - ".github/workflows/nse-hdfcbank-prior-year-comparison.yml"
      - "research/fundamental_pilot/xbrl_extract.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prior-year-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/free-fundamental-sources
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated parser dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/xbrl-deps" --no-save --no-package-lock fast-xml-parser@5.12.1
          mkdir -p node_modules
          ln -s "$RUNNER_TEMP/xbrl-deps/node_modules/fast-xml-parser" node_modules/fast-xml-parser
      - name: Resolve exact official NSE original consolidated banking filings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail --location --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 120 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" \
            --referer "https://www.nseindia.in/companies-listing/corporate-integrated-filing" \
            --header "Accept: application/json, text/plain, */*" \
            --get "https://www.nseindia.in/api/integrated-filing-results" \
            --data-urlencode "index=equities" --data-urlencode "symbol=HDFCBANK" \
            --data-urlencode "type=Integrated Filing- Financials" --data-urlencode "page=1" \
            --data-urlencode "size=100" --output artifacts/HDFCBANK_integrated_filing_api.json
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          import { resolveOriginalNseFilingPair } from './research/fundamental_pilot/nse_filing_pair.ts';
          const rows=JSON.parse(fs.readFileSync('artifacts/HDFCBANK_integrated_filing_api.json','utf8')).data ?? [];
          const selected=resolveOriginalNseFilingPair(rows,{
            symbol:'HDFCBANK',
            basis:'Consolidated',
            currentPeriod:'30-SEP-2026',
            priorPeriod:'30-SEP-2025',
          });
          const metadata={};
          for (const [key,row] of Object.entries(selected)) {
            metadata[key]=Object.fromEntries(['symbol','smName','seq_Id','qe_Date','type','type_Sub','audited','consolidated','broadcast_Date','creation_Date','revised_Date','revision_Remark','ixbrl','xbrl'].map(field=>[field,row[field] ?? null]));
            fs.writeFileSync(`artifacts/HDFCBANK_${key}_xbrl_url.txt`,row.xbrl);
          }
          fs.writeFileSync('artifacts/HDFCBANK_pair_metadata.json',JSON.stringify(metadata,null,2));
          console.log(JSON.stringify(metadata,null,2));
          JS
      - name: Download both original NSE XBRL instances
        shell: bash
        run: |
          set -euo pipefail
          cookie_jar="artifacts/hdfcbank-nse-cookies.txt"
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          for key in current prior; do
            xbrl_url="$(cat "artifacts/HDFCBANK_${key}_xbrl_url.txt")"
            downloaded=""
            for site in www.nseindia.in www.nseindia.com; do
              curl --silent --show-error --location --max-time 60 --user-agent "$ua" --cookie-jar "$cookie_jar" --output /dev/null "https://$site/companies-listing/corporate-integrated-filing" || true
              out="artifacts/${site}-${key}-download.response"
              curl --silent --show-error --location --max-time 120 --user-agent "$ua" --cookie "$cookie_jar" \
                --referer "https://$site/companies-listing/corporate-integrated-filing" \
                --header "Accept: application/xml,text/xml,*/*" --get "https://$site/api/download_xbrl" \
                --data-urlencode "fileUrl=$xbrl_url" --output "$out" || true
              if grep -Eqi '<([[:alnum:]_]+:)?xbrl([ >])' "$out"; then cp "$out" "artifacts/HDFCBANK_${key}.xml"; downloaded=yes; break; fi
            done
            if [ -z "$downloaded" ]; then
              for host in nsearchives.nseindia.in nsearchives.nseindia.com; do
                out="artifacts/${host}-${key}-direct.response"
                curl --silent --show-error --location --max-time 120 --user-agent "$ua" --cookie "$cookie_jar" \
                  --referer "https://www.nseindia.in/companies-listing/corporate-integrated-filing" \
                  --header "Accept: application/xml,text/xml,application/octet-stream,*/*" \
                  --output "$out" "https://$host/corporate/xbrl/${xbrl_url##*/}" || true
                if grep -Eqi '<([[:alnum:]_]+:)?xbrl([ >])' "$out"; then cp "$out" "artifacts/HDFCBANK_${key}.xml"; downloaded=yes; break; fi
              done
            fi
            if [ -z "$downloaded" ]; then echo "Unable to download official NSE XML for $key" >&2; exit 1; fi
            sha256sum "artifacts/HDFCBANK_${key}.xml" | tee "artifacts/HDFCBANK_${key}_SHA256.txt"
          done
      - name: Parse both filings and compare same-shape original facts
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          import { extractXbrl } from './research/fundamental_pilot/xbrl_extract.ts';
          const metadata=JSON.parse(fs.readFileSync('artifacts/HDFCBANK_pair_metadata.json','utf8'));
          const parsed={};
          for (const key of ['current','prior']) {
            const xml=fs.readFileSync(`artifacts/HDFCBANK_${key}.xml`,'utf8');
            const out=extractXbrl(xml);
            if (!out.contextCount || !out.factCount || !Object.keys(out.units).length) throw new Error(`Empty parse for ${key}`);
            const expectedEnd=key==='current'?'2026-09-30':'2025-09-30';
            const selected=out.facts.flatMap(f=>{
              const c=out.contexts[f.contextRef];
              if (!c) return [];
              const duration=!!c.periodStart && c.periodEnd===expectedEnd && !c.instant;
              const instant=!!c.instant && c.instant===expectedEnd && !c.periodStart && !c.periodEnd;
              if (!duration && !instant) return [];
              const shape=instant?'INSTANT|09-30':`${c.periodStart.slice(5)}|${c.periodEnd.slice(5)}`;
              return [{concept:f.concept,shape,dimensions:[...c.dimensions].sort(),unit:f.unitRef?out.units[f.unitRef]??null:null,rawValue:f.rawValue,numericValue:f.numericValue,isNil:f.isNil,contextRef:f.contextRef}];
            });
            parsed[key]={metadata:metadata[key],bytes:Buffer.byteLength(xml),contexts:out.contextCount,factCount:out.factCount,units:out.units,warnings:out.warnings,periodFacts:selected};
          }
          const makeIndex=(items)=>{
            const index=new Map(), duplicates=[];
            for (const f of items) {
              const key=JSON.stringify([f.concept,f.shape,f.dimensions,f.unit]);
              if (index.has(key)) {
                const old=index.get(key);
                if (old.rawValue!==f.rawValue || old.numericValue!==f.numericValue || old.isNil!==f.isNil) duplicates.push({key,first:old,duplicate:f});
              } else index.set(key,f);
            }
            return {index,duplicates};
          };
          const a=makeIndex(parsed.current.periodFacts), b=makeIndex(parsed.prior.periodFacts);
          const keys=[...new Set([...a.index.keys(),...b.index.keys()])];
          const matched=keys.filter(k=>a.index.has(k)&&b.index.has(k));
          const comparisons=matched.map(k=>({key:JSON.parse(k),current:a.index.get(k),priorOriginal:b.index.get(k),sameRawValue:a.index.get(k).rawValue===b.index.get(k).rawValue,sameNumericValue:a.index.get(k).numericValue===b.index.get(k).numericValue}));
          if (metadata.current.symbol!=='HDFCBANK' || metadata.prior.symbol!=='HDFCBANK' ||
              metadata.current.consolidated!=='Consolidated' || metadata.prior.consolidated!=='Consolidated' ||
              metadata.current.type_Sub!=='Original' || metadata.prior.type_Sub!=='Original') throw new Error('Issuer, basis or original-version identity check failed');
          if (parsed.current.warnings.length || parsed.prior.warnings.length) throw new Error('Parser emitted warnings; inspect before accepting this pair');
          if (!matched.length) throw new Error('No comparable concept/period/dimension/unit keys found');
          const report={status:'PARSE_AND_STRUCTURAL_COMPARISON_PASS',company:'HDFC Bank Limited',symbol:'HDFCBANK',filingFamily:'INTEGRATED_FILING_BANKING',basis:'Consolidated',periodEndCurrent:'2026-09-30',periodEndPrior:'2025-09-30',files:parsed,matchedKeyCount:matched.length,unmatchedKeyCount:keys.length-matched.length,conflictingDuplicateKeysCurrent:a.duplicates,conflictingDuplicateKeysPrior:b.duplicates,comparisons,note:'This validates raw-fact structural comparability only. It does not approve bank Revenue/Profit Growth, ROE, OCF, PBT or any industrial formula. Keep banking metric mapping sector-specific and research-only.'};
          fs.writeFileSync('artifacts/HDFCBANK_prior_year_comparison.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({status:report.status,current:{sequenceId:metadata.current.seq_Id,broadcast:metadata.current.broadcast_Date,contexts:parsed.current.contexts,facts:parsed.current.factCount,periodFacts:parsed.current.periodFacts.length,warnings:parsed.current.warnings.length},prior:{sequenceId:metadata.prior.seq_Id,broadcast:metadata.prior.broadcast_Date,contexts:parsed.prior.contexts,facts:parsed.prior.factCount,periodFacts:parsed.prior.periodFacts.length,warnings:parsed.prior.warnings.length},matchedKeyCount:matched.length,unmatchedKeyCount:report.unmatchedKeyCount,conflictingDuplicateKeysCurrent:a.duplicates.length,conflictingDuplicateKeysPrior:b.duplicates.length},null,2));
          JS
      - name: Upload original filings and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-hdfcbank-prior-year-xbrl-comparison
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
